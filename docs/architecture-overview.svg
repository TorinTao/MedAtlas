<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title description">
  <title id="title">MedAtlas 如何把研究方向变成可验证的研究选题</title>
  <desc id="description">研究者提出方向，MedAtlas 检索候选论文，Lexmount 读取和核验公开网页，Agent 借助 DeepSeek 整理证据并生成研究选题。私有 PDF 在个人工作区处理，不经过 Lexmount。研究者最终核对原文和开展实验。</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#f8faf7"/>
      <stop offset="1" stop-color="#edf5f1"/>
    </linearGradient>
    <linearGradient id="atlas" x2="1" y2="1">
      <stop stop-color="#102f3b"/>
      <stop offset="1" stop-color="#0a1f2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1a4b44" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#83a9a4"/>
    </marker>
    <style>
      text{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
      .heading{font-size:31px;font-weight:750;fill:#16343b}
      .sub{font-size:16px;fill:#5d7779}
      .label{font-size:13px;font-weight:750;letter-spacing:1.2px;fill:#168782}
      .card-title{font-size:22px;font-weight:750;fill:#173b42}
      .body{font-size:15px;fill:#536f73}
      .small{font-size:13px;fill:#6b8586}
      .white{fill:#eff9f5}
      .mint{fill:#9ce8cc}
    </style>
  </defs>
  <rect width="1280" height="660" rx="24" fill="url(#background)"/>
  <circle cx="1176" cy="72" r="92" fill="#dcece6" opacity=".6"/>
  <circle cx="1090" cy="20" r="4" fill="#d6b97b"/>
  <circle cx="1150" cy="118" r="3" fill="#79b6b2"/>
  <text x="50" y="66" class="heading">从研究方向，到有证据的下一步</text>
  <text x="50" y="99" class="sub">四个角色各司其职：找候选、读网页、组织证据，最后由研究者判断。</text>

  <path d="M 305 293 H 332" stroke="#83a9a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 600 293 H 627" stroke="#83a9a4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 895 293 H 922" stroke="#83a9a4" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="50" y="150" width="255" height="285" rx="18" fill="#fff" stroke="#d7e8e1" filter="url(#shadow)"/>
  <rect x="50" y="150" width="255" height="8" rx="4" fill="#80b8aa"/>
  <circle cx="84" cy="196" r="19" fill="#e4f3eb"/>
  <text x="77" y="202" font-size="16" font-weight="750" fill="#28776e">1</text>
  <text x="62" y="244" class="label">研究者</text>
  <text x="62" y="281" class="card-title">提出研究方向</text>
  <text x="62" y="317" class="body">例如“医学影像 + 病历</text>
  <text x="62" y="343" class="body">文本 Agent”。</text>
  <line x1="62" y1="371" x2="291" y2="371" stroke="#e1ece8"/>
  <text x="62" y="399" class="small">决定问题，最后核对与实验</text>

  <rect x="345" y="150" width="255" height="285" rx="18" fill="#fff" stroke="#d7e8e1" filter="url(#shadow)"/>
  <rect x="345" y="150" width="255" height="8" rx="4" fill="#6eaaa8"/>
  <circle cx="379" cy="196" r="19" fill="#e2f2ef"/>
  <text x="372" y="202" font-size="16" font-weight="750" fill="#28776e">2</text>
  <text x="357" y="244" class="label">MEDATLAS · 调度中心</text>
  <text x="357" y="281" class="card-title">找到候选论文</text>
  <text x="357" y="317" class="body">检索 PubMed、arXiv、</text>
  <text x="357" y="343" class="body">OpenAlex 等论文来源。</text>
  <line x1="357" y1="371" x2="586" y2="371" stroke="#e1ece8"/>
  <text x="357" y="399" class="small">去重、关联、保存来源</text>

  <rect x="640" y="150" width="255" height="285" rx="18" fill="#e6f5ee" stroke="#a7d9c5" filter="url(#shadow)"/>
  <rect x="640" y="150" width="255" height="8" rx="4" fill="#39a886"/>
  <circle cx="674" cy="196" r="19" fill="#c9eadb"/>
  <text x="667" y="202" font-size="16" font-weight="750" fill="#176f59">3</text>
  <text x="652" y="244" class="label">LEXMOUNT · 网页读取</text>
  <text x="652" y="281" class="card-title">核验公开页面</text>
  <text x="652" y="317" class="body">读取论文页、摘要和公开</text>
  <text x="652" y="343" class="body">仓库页，核对链接与内容。</text>
  <line x1="652" y1="371" x2="881" y2="371" stroke="#b8dfce"/>
  <text x="652" y="399" class="small">留下网址、抓取时间与依据</text>

  <rect x="935" y="150" width="295" height="285" rx="18" fill="url(#atlas)" filter="url(#shadow)"/>
  <rect x="935" y="150" width="295" height="8" rx="4" fill="#62c4aa"/>
  <circle cx="969" cy="196" r="19" fill="#245a5a"/>
  <text x="962" y="202" font-size="16" font-weight="750" fill="#b9eed8">4</text>
  <text x="947" y="244" class="label mint">AGENT · DEEPSEEK</text>
  <text x="947" y="281" class="card-title white">整理证据与提出选题</text>
  <text x="947" y="317" class="body white">生成中文概述、精读、</text>
  <text x="947" y="343" class="body white">研究空白和实验方案。</text>
  <line x1="947" y1="371" x2="1218" y2="371" stroke="#45616b"/>
  <text x="947" y="399" class="small mint">引用回到已检索论文</text>

  <rect x="50" y="471" width="1180" height="78" rx="15" fill="#fff" stroke="#d7e8e1"/>
  <rect x="50" y="471" width="7" height="78" rx="3" fill="#62b9a5"/>
  <text x="75" y="502" font-size="14" font-weight="750" fill="#227e72">交付给研究者</text>
  <text x="75" y="529" font-size="19" font-weight="700" fill="#193941">研究星图　·　中文阅读　·　附来源的 Research Ideas　→　回到原文核对并做实验</text>

  <rect x="50" y="566" width="1180" height="62" rx="13" fill="#e8efed" stroke="#d4e1dc"/>
  <text x="75" y="592" font-size="14" font-weight="750" fill="#3d6866">私有资料边界</text>
  <text x="75" y="614" font-size="14" fill="#5b7575">用户上传的 PDF 留在受保护的个人工作区，可用于 AI 阅读；不发送给 Lexmount Web Fetch。</text>
</svg>
